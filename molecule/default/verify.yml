---
- name: Verify Tautulli
  hosts: all
  become: true
  gather_facts: false

  vars:
    # This is a role default, but a Jinja-derived one, and a verify play cannot
    # resolve it out of defaults/main.yml - so it is spelled out here.
    tautulli_verify_data_path: /tautulli/data

    tautulli_verify_origin: "http://127.0.0.1:18181"
    tautulli_verify_url: "{{ tautulli_verify_origin }}/tautulli-ui"
    tautulli_verify_api_url: "{{ tautulli_verify_url }}/api/v2?apikey={{ tautulli_molecule_api_key }}"

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    tautulli_verify_uid: 1873
    tautulli_verify_gid: 1873
    tautulli_verify_hostname: tautulli.molecule.local
    tautulli_verify_path_prefix: /tautulli-ui
    tautulli_verify_http_port: 8282
    tautulli_verify_basic_auth_users: "molecule:$apr1$molecule$71DtE3xj/6PCMkh0SmxZ61"
    tautulli_verify_timezone: Asia/Tokyo
    tautulli_verify_timezone_abbreviation: JST

    tautulli_verify_units:
      - tautulli.service

  tasks:
    - name: Verify that Tautulli works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertions
        # below to the version the role really pins.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: tautulli_defaults

        # ------------------------------------------------------------------
        # The systemd unit
        # ------------------------------------------------------------------

        - name: Wait for the Tautulli systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: tautulli_services
          until: tautulli_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ tautulli_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Tautulli systemd services are active
          ansible.builtin.assert:
            that: tautulli_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(tautulli_verify_units | zip(tautulli_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Tautulli systemd services log for debugging
          when: tautulli_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ tautulli_verify_units }}"

        # A published Docker port with nothing listening behind it resets the
        # connection rather than refusing it, which `uri` reports as status -1.
        # The loop has to survive that, so failures are tolerated here and judged
        # after. Asking the API for a database check, rather than for the plain
        # status, makes Tautulli open its SQLite database to answer.
        - name: Wait for Tautulli to report its database healthy (up to 180s)
          ansible.builtin.uri:
            url: "{{ tautulli_verify_api_url }}&cmd=status&check=database"
            method: GET
            follow_redirects: none
          register: tautulli_health
          until: >-
            tautulli_health.status == 200
            and (tautulli_health.json | default({})).get('response', {}).get('data', {}).get('integrity_check', '') == 'ok'
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # raw HTTP error.
          failed_when: false

        # The API answers under the configured path prefix and to the API key the
        # role passes in. Tautulli generates a random key on first start, so an
        # answer at all means both reached the process.
        - name: Assert Tautulli answers the role's API key under the path prefix
          ansible.builtin.assert:
            that:
              - tautulli_health.status == 200
              - tautulli_health.json.response.result == 'success'
              - tautulli_health.json.response.data.integrity_check == 'ok'
            fail_msg: "Tautulli did not report its database healthy: {{ tautulli_health.json | default(tautulli_health.status) }}"
            success_msg: "Tautulli answers the role's API key under {{ tautulli_verify_path_prefix }}, and its database is ok"

        # ------------------------------------------------------------------
        # What `docker create` was actually told
        # ------------------------------------------------------------------

        - name: Inspect Tautulli container
          ansible.builtin.command:
            cmd: docker container inspect tautulli
          register: tautulli_container_raw
          changed_when: false

        - name: Parse the Tautulli container definition
          ansible.builtin.set_fact:
            tautulli_container: "{{ (tautulli_container_raw.stdout | from_json)[0] }}"
            tautulli_extra_mount: >-
              {{ (tautulli_container_raw.stdout | from_json)[0].Mounts
                 | selectattr('Destination', 'equalto', tautulli_molecule_extra_volume_dst) | list }}

        - name: Assert that tautulli_container_additional_volumes_custom reached the container
          ansible.builtin.assert:
            that:
              - tautulli_extra_mount | length == 1
              - tautulli_extra_mount[0].Type == 'bind'
              - tautulli_extra_mount[0].Source == tautulli_molecule_extra_volume_src
              - not tautulli_extra_mount[0].RW
            fail_msg: "The additional volume did not reach the container: {{ tautulli_container.Mounts }}"
            success_msg: "The additional volume is mounted read-only at {{ tautulli_molecule_extra_volume_dst }}"

        - name: Read the marker through the additional volume
          ansible.builtin.command:
            cmd: >-
              docker exec tautulli
              cat {{ tautulli_molecule_extra_volume_dst }}/{{ tautulli_molecule_marker_filename }}
          register: tautulli_extra_volume
          changed_when: false

        - name: Assert the additional volume is mounted into the Tautulli container
          ansible.builtin.assert:
            that: tautulli_extra_volume.stdout | trim == tautulli_molecule_extra_volume_marker
            fail_msg: "The additional volume did not carry the marker into the container"
            success_msg: "The additional volume carries the marker into the container"

        - name: Assert that the read-only container still gets its writable /tmp
          ansible.builtin.assert:
            that:
              - tautulli_container.HostConfig.ReadonlyRootfs
              - "'/tmp' in (tautulli_container.HostConfig.Tmpfs | default({}))"
            fail_msg: >-
              The container's root filesystem is
              {{ 'read-only' if tautulli_container.HostConfig.ReadonlyRootfs else 'writable' }}
              and its tmpfs mounts are {{ tautulli_container.HostConfig.Tmpfs | default({}) }}
            success_msg: "The container is read-only with a tmpfs mount at /tmp"

        - name: Assert that the role's uid, gid and timezone reached the container
          ansible.builtin.assert:
            that:
              - tautulli_container.Config.User == (tautulli_verify_uid | string) ~ ':' ~ (tautulli_verify_gid | string)
              - ('TZ=' ~ tautulli_verify_timezone) in tautulli_container.Config.Env
            fail_msg: >-
              The container runs as {{ tautulli_container.Config.User }}
              with {{ tautulli_container.Config.Env | select('match', 'TZ=') | list }}
            success_msg: "The container runs as {{ tautulli_container.Config.User }} with the matching TZ"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - tautulli_container.Config.Image == 'ghcr.io/tautulli/tautulli:' ~ tautulli_defaults.tautulli_version
              - tautulli_container.Config.Labels['org.opencontainers.image.version'] | default('') == tautulli_defaults.tautulli_version
            fail_msg: >-
              The container runs {{ tautulli_container.Config.Image }}
              ({{ tautulli_container.Config.Labels['org.opencontainers.image.version'] | default('no version label') }}),
              not the {{ tautulli_defaults.tautulli_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ tautulli_container.Config.Image }}"

        # The image's own health check asks port 8181, where nothing listens
        # in this scenario, so the container turns healthy only with the role's.
        - name: Wait for the Tautulli container to turn healthy (up to 180s)
          ansible.builtin.command:
            cmd: docker container inspect tautulli
          register: tautulli_container_health_raw
          until: ((tautulli_container_health_raw.stdout | from_json)[0].State.Health.Status | default('')) == 'healthy'
          retries: 36
          delay: 5
          changed_when: false
          failed_when: false

        - name: Assert the Tautulli container is healthy
          ansible.builtin.assert:
            that: ((tautulli_container_health_raw.stdout | from_json)[0].State.Health.Status | default('')) == 'healthy'
            fail_msg: "The container's health is {{ (tautulli_container_health_raw.stdout | from_json)[0].State.Health | default('not checked') }}"
            success_msg: "The container is healthy"

        # ------------------------------------------------------------------
        # Traefik labels
        # ------------------------------------------------------------------

        - name: Assert that the Traefik labels describe the configured hostname and path prefix
          ansible.builtin.assert:
            that:
              - tautulli_container.Config.Labels['traefik.enable'] == 'true'
              - tautulli_container.Config.Labels['traefik.http.routers.tautulli.rule'] == 'Host(`' ~ tautulli_verify_hostname ~ '`) && PathPrefix(`' ~ tautulli_verify_path_prefix ~ '`)'
              - "'traefik.http.middlewares.tautulli-strip-prefix.stripprefix.prefixes' not in tautulli_container.Config.Labels"
              - tautulli_container.Config.Labels['traefik.http.services.tautulli.loadbalancer.server.port'] == tautulli_verify_http_port | string
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ tautulli_container.Config.Labels }}"
            success_msg: "The Traefik labels route {{ tautulli_verify_hostname }}{{ tautulli_verify_path_prefix }} to port {{ tautulli_verify_http_port }}"

        # Defining the middleware is not enough: Traefik only applies the ones the
        # router lists, so the router has to carry it too.
        - name: Assert that the basic-auth middleware is defined and attached to the Tautulli router
          ansible.builtin.assert:
            that:
              - tautulli_container.Config.Labels['traefik.http.middlewares.tautulli-basic-auth.basicauth.users'] == tautulli_verify_basic_auth_users
              - "'tautulli-basic-auth' in tautulli_container.Config.Labels['traefik.http.routers.tautulli.middlewares'].split(',')"
            fail_msg: "The basic-auth middleware is missing or not attached to the router: {{ tautulli_container.Config.Labels }}"
            success_msg: "The basic-auth middleware is defined and attached to the Tautulli router"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees and does
        # ------------------------------------------------------------------

        - name: Ask the Tautulli container which timezone and user it is running in
          ansible.builtin.command:
            cmd: docker exec tautulli sh -c 'date +%Z; id -u; id -g'
          register: tautulli_process_identity
          changed_when: false

        - name: Assert that the Tautulli process runs in the role's timezone, as the role's user
          ansible.builtin.assert:
            that:
              - tautulli_process_identity.stdout_lines[0] == tautulli_verify_timezone_abbreviation
              - tautulli_process_identity.stdout_lines[1] == tautulli_verify_uid | string
              - tautulli_process_identity.stdout_lines[2] == tautulli_verify_gid | string
            fail_msg: >-
              The container reports zone/uid/gid {{ tautulli_process_identity.stdout_lines }},
              expected [{{ tautulli_verify_timezone_abbreviation }},
              {{ tautulli_verify_uid }}, {{ tautulli_verify_gid }}]
            success_msg: >-
              The Tautulli process runs in {{ tautulli_process_identity.stdout_lines[0] }}
              as {{ tautulli_process_identity.stdout_lines[1] }}:{{ tautulli_process_identity.stdout_lines[2] }}

        - name: Read what the running Tautulli reports about itself
          ansible.builtin.uri:
            url: "{{ tautulli_verify_api_url }}&cmd=get_tautulli_info"
            method: GET
            follow_redirects: none
          register: tautulli_info
          changed_when: false

        - name: Assert the running Tautulli reports the version this role installs
          ansible.builtin.assert:
            that: tautulli_info.json.response.data.tautulli_version == tautulli_defaults.tautulli_version
            fail_msg: "Tautulli reports version {{ tautulli_info.json.response.data.tautulli_version | default('none') }}, expected {{ tautulli_defaults.tautulli_version }}"
            success_msg: "Tautulli reports version {{ tautulli_info.json.response.data.tautulli_version }}"

        # Until its setup wizard is completed, Tautulli redirects its start page to
        # the wizard. It takes the scheme of that redirect from `X-Forwarded-Proto`
        # only with TAUTULLI_HTTP_PROXY on, and would otherwise send the browser to
        # plain http behind Traefik's TLS.
        - name: Ask Tautulli for its start page, as Traefik would forward it
          ansible.builtin.uri:
            url: "{{ tautulli_verify_url }}/"
            method: GET
            follow_redirects: none
            headers:
              Host: "{{ tautulli_verify_hostname }}"
              X-Forwarded-Host: "{{ tautulli_verify_hostname }}"
              X-Forwarded-Proto: https
            status_code: [303]
          register: tautulli_start_page
          changed_when: false

        - name: Assert Tautulli redirects to its setup wizard at the public scheme and hostname
          ansible.builtin.assert:
            that: tautulli_start_page.location == 'https://' ~ tautulli_verify_hostname ~ tautulli_verify_path_prefix ~ '/welcome'
            fail_msg: "Tautulli redirects its start page to {{ tautulli_start_page.location | default('nowhere') }}"
            success_msg: "Tautulli redirects its start page to {{ tautulli_start_page.location }}"

        # The API could be answering out of memory. Tautulli keeps its state in a
        # SQLite database in the directory the role bind-mounts, so the database
        # has to be there, on the host side of the mount, owned by the role's user.
        - name: Look up the Tautulli database under the role's data path
          ansible.builtin.stat:
            path: "{{ tautulli_verify_data_path }}/tautulli.db"
          register: tautulli_database

        - name: Assert the Tautulli database lives under the role's data path
          ansible.builtin.assert:
            that:
              - tautulli_database.stat.exists
              - tautulli_database.stat.uid == tautulli_verify_uid
              - tautulli_database.stat.gid == tautulli_verify_gid
            fail_msg: "{{ tautulli_verify_data_path }}/tautulli.db is {{ tautulli_database.stat }}"
            success_msg: "{{ tautulli_verify_data_path }}/tautulli.db exists and belongs to {{ tautulli_verify_uid }}:{{ tautulli_verify_gid }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "tautulli_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: tautulli_restarts_before
              loop: "{{ tautulli_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: tautulli_restarts_after
              loop: "{{ tautulli_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - tautulli_restarts_after.results | map(attribute='status.NRestarts') | list == tautulli_restarts_before.results | map(attribute='status.NRestarts') | list
                  - tautulli_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in tautulli_verify_units | zip(tautulli_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in tautulli_verify_units | zip(tautulli_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in tautulli_verify_units | zip(tautulli_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Tautulli verification summary
          ansible.builtin.debug:
            msg:
              - "Tautulli systemd: {% for unit, state in tautulli_verify_units | zip(tautulli_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Tautulli version: {{ tautulli_info.json.response.data.tautulli_version }}"
              - "Tautulli start page redirect: {{ tautulli_start_page.location }}"
              - "Tautulli database: {{ tautulli_verify_data_path }}/tautulli.db ({{ tautulli_health.json.response.message }})"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Tautulli systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=tautulli.service
          register: tautulli_service_log
          changed_when: false

        - name: Show the Tautulli systemd service log
          ansible.builtin.debug:
            var: tautulli_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Tautulli verification failed. The systemd service log is printed above."

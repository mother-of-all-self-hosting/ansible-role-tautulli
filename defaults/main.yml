---
# Project source code URL: https://github.com/Tautulli/Tautulli

tautulli_enabled: true

tautulli_identifier: tautulli
tautulli_base_path: "/{{ tautulli_identifier }}"
tautulli_data_path: "{{ tautulli_base_path }}/data"

# renovate: datasource=docker depName=ghcr.io/tautulli/tautulli versioning=semver
tautulli_version: v2.18.2
tautulli_arch: amd64

tautulli_uid: ""
tautulli_gid: ""

# The hostname at which Tautulli is served.
tautulli_hostname: ""

# The path at which Tautulli is served.
# This value must either be `/` or not end with a slash (e.g. `/tautulli`).
tautulli_path_prefix: /

tautulli_container_image: "{{ tautulli_container_image_registry_prefix }}tautulli/tautulli:{{ tautulli_container_image_tag }}"
tautulli_container_image_tag: "{{ tautulli_version }}"
tautulli_container_image_registry_prefix: "{{ tautulli_container_image_registry_prefix_upstream }}"
tautulli_container_image_registry_prefix_upstream: "{{ tautulli_container_image_registry_prefix_upstream_default }}"
tautulli_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
tautulli_container_network: "{{ tautulli_identifier }}"

# Control if the container network is deleted on uninstalling.
tautulli_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `tautulli_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8181"), or empty string to not expose.
tautulli_container_http_host_bind_port: ""

# The port number in the container
tautulli_container_http_port: 8181

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
tautulli_container_additional_networks: "{{ tautulli_container_additional_networks_auto + tautulli_container_additional_networks_custom }}"
tautulli_container_additional_networks_auto: []
tautulli_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
tautulli_container_additional_volumes: "{{ tautulli_container_additional_volumes_auto + tautulli_container_additional_volumes_custom }}"
tautulli_container_additional_volumes_auto: []
tautulli_container_additional_volumes_custom: []

# tautulli_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `tautulli_container_labels_additional_labels_custom`.
tautulli_container_labels_traefik_enabled: true
tautulli_container_labels_traefik_docker_network: "{{ tautulli_container_network }}"
tautulli_container_labels_traefik_hostname: "{{ tautulli_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/tautulli`).
tautulli_container_labels_traefik_path_prefix: "{{ tautulli_path_prefix }}"
tautulli_container_labels_traefik_rule: "Host(`{{ tautulli_container_labels_traefik_hostname }}`){% if tautulli_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ tautulli_container_labels_traefik_path_prefix }}`){% endif %}"
tautulli_container_labels_traefik_priority: 0
tautulli_container_labels_traefik_entrypoints: web-secure
tautulli_container_labels_traefik_tls: "{{ tautulli_container_labels_traefik_entrypoints != 'web' }}"
tautulli_container_labels_traefik_tls_certResolver: default  # noqa var-naming
tautulli_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
tautulli_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `tautulli_container_labels_traefik_additional_request_headers_custom`
tautulli_container_labels_traefik_additional_request_headers: "{{ tautulli_container_labels_traefik_additional_request_headers_auto | combine(tautulli_container_labels_traefik_additional_request_headers_custom) }}"
tautulli_container_labels_traefik_additional_request_headers_auto: {}
tautulli_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `tautulli_container_labels_traefik_additional_response_headers_custom`
tautulli_container_labels_traefik_additional_response_headers: "{{ tautulli_container_labels_traefik_additional_response_headers_auto | combine(tautulli_container_labels_traefik_additional_response_headers_custom) }}"
tautulli_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': tautulli_http_header_xss_protection} if tautulli_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': tautulli_http_header_content_type_options} if tautulli_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': tautulli_http_header_content_security_policy} if tautulli_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': tautulli_http_header_permissions_policy} if tautulli_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': tautulli_http_header_strict_transport_security} if tautulli_http_header_strict_transport_security and tautulli_container_labels_traefik_tls else {})
  }}
tautulli_container_labels_traefik_additional_response_headers_custom: {}

# tautulli_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `tautulli_container_labels_additional_labels_custom`
#
# Example:
# tautulli_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
tautulli_container_labels_additional_labels: "{{ tautulli_container_labels_additional_labels_auto + tautulli_container_labels_additional_labels_custom }}"
tautulli_container_labels_additional_labels_auto: []
tautulli_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume (/tmp)
tautulli_container_tmpfs_tmp_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
tautulli_container_extra_arguments: "{{ tautulli_container_extra_arguments_auto + tautulli_container_extra_arguments_custom }}"
tautulli_container_extra_arguments_auto: []
tautulli_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
tautulli_process_extra_arguments: "{{ tautulli_process_extra_arguments_auto + tautulli_process_extra_arguments_custom }}"
tautulli_process_extra_arguments_auto: []
tautulli_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
tautulli_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
tautulli_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
tautulli_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
tautulli_http_header_permissions_policy: "{{ 'interest-cohort=()' if tautulli_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
tautulli_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if tautulli_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `tautulli_http_header_permissions_policy`
tautulli_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `tautulli_http_header_strict_transport_security`
tautulli_hsts_preload_enabled: false

# List of systemd services that the Tautulli systemd service depends on
tautulli_systemd_required_services_list: "{{ tautulli_systemd_required_services_list_default + tautulli_systemd_required_services_list_auto + tautulli_systemd_required_services_list_custom }}"
tautulli_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
tautulli_systemd_required_services_list_auto: []
tautulli_systemd_required_services_list_custom: []

# List of systemd services that the Tautulli systemd service wants
tautulli_systemd_wanted_services_list: "{{ tautulli_systemd_wanted_services_list_default + tautulli_systemd_wanted_services_list_auto + tautulli_systemd_wanted_services_list_custom }}"
tautulli_systemd_wanted_services_list_default: []
tautulli_systemd_wanted_services_list_auto: []
tautulli_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
tautulli_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
tautulli_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
tautulli_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
tautulli_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ tautulli_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ tautulli_container_stop_grace_time_seconds }} {{ tautulli_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ tautulli_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ tautulli_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ tautulli_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ tautulli_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ tautulli_identifier }} after {{ tautulli_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
tautulli_environment_variables_tz: "Etc/UTC"

# Controls whether Tautulli's "Enable HTTP Proxy" setting is switched on, which makes it respect the
# `X-Forwarded-*` headers of a reverse-proxy, so that the redirects it sends use the public scheme and hostname.
# When disabled, the role leaves the setting to Tautulli's web UI.
tautulli_environment_variables_tautulli_http_proxy: "{{ tautulli_container_labels_traefik_enabled }}"

# Additional environment variables.
#
# Tautulli reads any of its settings from a `TAUTULLI_<SETTING>` environment variable
# (e.g. `TAUTULLI_API_KEY`), which then overrides `config.ini` and is locked in the web UI.
tautulli_environment_variables_additional_variables: ""

# tautulli_restart_necessary controls whether the Tautulli systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
tautulli_restart_necessary: false

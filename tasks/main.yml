---
- name: Perform Tautulli installation tasks
  when: tautulli_enabled | bool
  tags:
    - setup-all
    - setup-tautulli
    - install-all
    - install-tautulli
  block:
    - name: Validate Tautulli configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Tautulli
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform tasks to print the temporary password for Tautulli
  when: tautulli_enabled | bool
  tags:
    - molecule-notest
    - print-password-tautulli
  block:
    - name: Print the Tautulli temporary password
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/print_password_tautulli.yml"

- name: Perform Tautulli uninstallation tasks
  when: not tautulli_enabled | bool
  tags:
    - setup-all
    - setup-tautulli
  block:
    - name: Uninstall Tautulli
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"

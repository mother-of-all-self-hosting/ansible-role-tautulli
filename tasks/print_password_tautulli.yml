---
- name: Find the Tautulli temporary password in the service log
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      journalctl -u {{ tautulli_identifier }} --no-pager --output=cat | grep -- 'Username: .* Password: ' | tail -n 1
    executable: /bin/bash
  register: tautulli_temporary_password_log
  changed_when: false
  # grep exits with 1 when it finds nothing, which the task below reports
  failed_when: tautulli_temporary_password_log.rc not in [0, 1]

- name: Extract the Tautulli temporary login
  ansible.builtin.set_fact:
    tautulli_temporary_username: >-
      {{ tautulli_temporary_password_log.stdout | regex_search('Username: (\S+)\s+Password: ', '\1') | default([], true) | first | default('') }}
    tautulli_temporary_password: >-
      {{ tautulli_temporary_password_log.stdout | regex_search('Password: ([A-Za-z0-9_-]+)', '\1') | default([], true) | first | default('') }}

- name: Fail if no Tautulli temporary password was found
  ansible.builtin.fail:
    msg: >-
      No temporary password found in the {{ tautulli_identifier }} service log.
      Tautulli logs it only once, when it starts without a password set, so it may have rotated out of the journal.
  when: tautulli_temporary_password == ""

- name: Print the Tautulli temporary password
  ansible.builtin.debug:
    msg: "Log in to Tautulli as `{{ tautulli_temporary_username }}` with the temporary password: {{ tautulli_temporary_password }}"

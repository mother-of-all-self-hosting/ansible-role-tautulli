---
- name: Fail if required Tautulli settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - tautulli_uid
    - tautulli_gid
    - tautulli_hostname

- name: Fail if Tautulli architecture is not supported
  ansible.builtin.fail:
    msg: >-
      Your configuration specifies a CPU architecture (`{{ tautulli_arch }}`) which is not currently supported.
      This Tautulli role also does not support self-building yet, so it's not possible to make use of it.
  when: "tautulli_arch not in ['amd64', 'arm64']"

- name: Validate Tautulli Traefik configuration
  when: tautulli_container_labels_traefik_enabled | bool
  block:
    - name: Fail if required Tautulli Traefik settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "tautulli_container_labels_traefik_hostname", when: true }
        - { "name": "tautulli_container_labels_traefik_path_prefix", when: true }
        - { "name": "tautulli_container_labels_traefik_middleware_basic_auth_users", when: "{{ tautulli_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `tautulli_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if tautulli_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          tautulli_container_labels_traefik_path_prefix (`{{ tautulli_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/tautulli`).
      when: "tautulli_container_labels_traefik_path_prefix != '/' and tautulli_container_labels_traefik_path_prefix[-1] == '/'"
